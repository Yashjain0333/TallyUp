server {
    listen 80;
    server_name localhost;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # FastAPI reverse proxy
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
    
    # !!!! MongoDB access for development - Production ME HATA DENA
    location /mongodb/ { 
        # DEVELOPMENT ONLY - SECURITY RISK - Production ME HATA DENA
        proxy_pass http://mongodb:27017/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # MongoDB requires WebSocket support for connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeoouts MongoDB
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        
        # warning
        add_header X-Warning "Development access only. Production ME HATA DENA." always;
    }

    # Static 
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # Default health checks
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # OpenAPI JSON route (for Swagger/Redoc)
    location /api/openapi.json {
        proxy_pass http://api:8000/openapi.json;  # Ensure FastAPI is serving the OpenAPI spec
    }

    # Swagger UI (Docs) route
    location /api/docs {
        proxy_pass http://api:8000/docs;  # Serve Swagger UI
    }

    # Redoc UI (Docs) route
    location /api/redoc {
        proxy_pass http://api:8000/redoc;  # Serve Redoc UI if you want to use Redoc for Swagger docs
    }
}